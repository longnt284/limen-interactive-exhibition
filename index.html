<script>try{var s=localStorage.getItem('limen:theme');document.documentElement.dataset.theme=s==='light'||s==='dark'?s:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<style>
 :root{color-scheme:dark}
 html{background:#111c1b}
 html[data-theme=light]{background:#d4dddc;color-scheme:light}
 body{margin:0}
 #curtain{position:fixed;inset:0;z-index:9;display:grid;place-content:center;justify-items:center;gap:26px;
  background:#111c1b;color:#e8ede7;font-family:Archivo Variable,Manrope,system-ui,sans-serif;
  transition:opacity .9s ease,visibility .9s}
 html[data-theme=light] #curtain{background:#d4dddc;color:#152722}
 #curtain .mark{font-size:clamp(46px,8vw,104px);font-weight:600;letter-spacing:-.06em;line-height:1;
  display:flex;gap:.02em}
 #curtain .mark span{display:block;animation:curtain-in .9s cubic-bezier(.2,.7,.2,1) backwards}
 #curtain .sub{font-size:10px;letter-spacing:2.4px;opacity:.55;text-align:center;line-height:1.9;
  animation:curtain-in .9s .5s cubic-bezier(.2,.7,.2,1) backwards}
 #curtain .bar{width:min(210px,44vw);height:1px;background:#ffffff26;overflow:hidden}
 html[data-theme=light] #curtain .bar{background:#193a2926}
 #curtain .bar i{display:block;height:100%;background:#d0e99d;transform-origin:left center;
  animation:curtain-bar 2.6s cubic-bezier(.3,.8,.3,1) infinite}
 html[data-theme=light] #curtain .bar i{background:#3f5f26}
 @keyframes curtain-in{from{transform:translateY(42%);opacity:0}}
 @keyframes curtain-bar{0%{transform:scaleX(0)}70%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
 @media(prefers-reduced-motion:reduce){#curtain *{animation:none!important}#curtain .bar i{transform:scaleX(1)}}
 html[data-ready] #curtain{opacity:0;visibility:hidden;pointer-events:none}
</style>

<div id="curtain" role="status" aria-live="polite">
 <div class="mark" aria-label="LIMEN"><span style="animation-delay:0s">L</span><span style="animation-delay:.06s">I</span><span style="animation-delay:.12s">M</span><span style="animation-delay:.18s">E</span><span style="animation-delay:.24s">N</span></div>

<noscript>
 <div style="max-width:38rem;margin:14vh auto;padding:0 8vw;font-family:system-ui,sans-serif;color:#e8ede7;line-height:1.9">
  <h1 style="font-weight:400;letter-spacing:-.04em">LIMEN — An exhibition of impossible forms</h1>
  <p>Triển lãm nghệ thuật 3D tương tác phi thương mại. Trang cần JavaScript để dựng cảnh 3D. Tám chương của hành trình:</p>
  <ol>
   <li><strong>Ngưỡng cửa</strong> — Bước qua điều quen thuộc.</li>
   <li><strong>Khai mở</strong> — Mở ra. Không giới hạn.</li>
   <li><strong>Quỹ đạo</strong> — Xa nhau. Vẫn kết nối.</li>
   <li><strong>Thủy triều</strong> — Lắng nghe một làn sóng.</li>
   <li><strong>Nở rộ</strong> — Một chuyển động. Ngàn cách nở.</li>
   <li><strong>Phân rã</strong> — Buông khỏi hình hài.</li>
   <li><strong>Hội tụ</strong> — Tìm nhau. Thành một.</li>
   <li><strong>Dư âm</strong> — Mang theo một khoảng lặng.</li>
  </ol>
 </div>
</noscript>
